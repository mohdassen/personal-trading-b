name: IBS Parallel Forward Accelerator

on:
  workflow_dispatch:
  push:
    branches: [research/edge-discovery-proof]
    paths:
      - ibs_parallel_forward_accelerator.py
      - .github/workflows/ibs-parallel-forward-accelerator.yml
  schedule:
    - cron: '25 21 * * 1-5'

permissions:
  contents: write

jobs:
  forward:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/edge-discovery-proof
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile ibs_parallel_forward_accelerator.py
      - name: Run time-boxed forward accelerator
        run: python ibs_parallel_forward_accelerator.py
      - name: Persist forward evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ibs_parallel_forward_accelerator.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "forward: update parallel IBS evidence"
          git pull --rebase origin research/edge-discovery-proof
          git push origin HEAD:research/edge-discovery-proof
