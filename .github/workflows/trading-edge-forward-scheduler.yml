name: Trading Edge Forward Scheduler

on:
  # freshness-v2: research scripts reject stale upstream daily data
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/trading-edge-forward-scheduler.yml
  schedule:
    - cron: '30 21 * * 1-5'

permissions:
  contents: write

jobs:
  forward-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/edge-discovery-proof
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run frozen QQQ forward shadow
        run: python qqq_ibs_forward_shadow.py
      - name: Run parallel forward accelerator
        run: python ibs_parallel_forward_accelerator.py
      - name: Persist both forward states
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/qqq_ibs_forward_shadow.json data/ibs_parallel_forward_accelerator.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "forward: scheduled evidence update"
          git pull --rebase origin research/edge-discovery-proof
          git push origin HEAD:research/edge-discovery-proof
