name: V7 Historical Edge Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v7-historical-edge.yml']
permissions:
  contents: write
concurrency:
  group: v7-historical-edge
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v7-catalyst-router-mtf
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync research code
        run: |
          git fetch origin research/v7-catalyst-router-mtf
          git reset --hard origin/research/v7-catalyst-router-mtf
      - name: Run primary chronological V7 validation
        run: python research_backtest_v7.py
      - name: Preserve primary report
        run: cp data/v7_historical_edge_report.json data/v7_historical_edge_primary.json
      - name: Run independent trend-pullback falsification test
        run: python v7_historical_edge_test.py
      - name: Preserve independent report
        run: cp data/v7_historical_edge_report.json data/v7_historical_edge_independent.json
      - name: Persist both reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v7_historical_edge_primary.json data/v7_historical_edge_independent.json
          git commit -m 'research: update dual V7 historical edge reports' || exit 0
          git push origin HEAD:research/v7-catalyst-router-mtf
