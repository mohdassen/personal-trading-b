name: V5.1 Stress Runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v51-stress-runner.yml'

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v51-active-challenger
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run V5.1 stress tests
        run: python v51_stress_test.py
