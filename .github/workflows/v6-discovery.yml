name: V7 Adaptive Paper Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v6-discovery.yml'
  schedule:
    - cron: '5,35 13-21 * * 1-5'

permissions:
  contents: write
concurrency:
  group: v7-adaptive-paper-discovery
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v7-catalyst-router-mtf
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync V7 research branch
        run: |
          git fetch origin research/v7-catalyst-router-mtf
          git reset --hard origin/research/v7-catalyst-router-mtf
      - name: Unit-test V7 decision logic
        run: python -m unittest tests/test_v7_decision_engine.py
      - name: Run V7 catalyst-router-MTF paper engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python v7_runner.py
      - name: Persist V7 research state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v6_discovery.json data/v7_decision_snapshot.json data/v7_paper_state.json data/v7_alert_state.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update V7 paper research state"
          for attempt in 1 2 3; do
            if git push origin HEAD:research/v7-catalyst-router-mtf; then exit 0; fi
            git fetch origin research/v7-catalyst-router-mtf
            git rebase -X theirs origin/research/v7-catalyst-router-mtf || { git rebase --abort || true; exit 1; }
          done
          exit 1

