name: Sharia Intraday Paper Watch
on:
  workflow_dispatch:
  schedule:
    - cron: '0,30 13-20 * * 1-5'
concurrency:
  group: intraday-paper-alert-single-flight
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/edge-discovery-proof
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile sharia_intraday_watch.py manual_trade_risk_guard.py
      - name: Risk sizing unit tests
        run: python -m unittest -v test_manual_trade_risk_guard.py
      - name: Verify paper monitor safety contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('sharia_intraday_watch.py').read_text()
          assert 'BLOCKED: stale market snapshot' in s
          assert 'REAL BUY BLOCKED' in s
          assert 'Telegram rejected alert' in s
          assert '.alert-sent-marker' in s
          print('Paper monitor safety contract PASS')
          PY
      - name: Compute signal fingerprint
        id: fingerprint
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=json.loads(Path('data/wide_market_ibs_forward.json').read_text())
          payload={'date':d.get('latest_downloaded_market_date'), 'buy':sorted(d.get('pending_entries',[])), 'exit':sorted(d.get('pending_exits',[]))}
          digest=hashlib.sha256(json.dumps(payload,sort_keys=True).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('hash='+digest+'\n')
          PY
      - name: Check prior signal notification
        id: alertcache
        uses: actions/cache/restore@v4
        with:
          path: .alert-sent-marker
          key: intraday-paper-alert-${{ steps.fingerprint.outputs.hash }}
      - name: Read-only paper signal watch
        if: steps.alertcache.outputs.cache-hit != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python sharia_intraday_watch.py
      - name: Remember sent signal notification
        if: steps.alertcache.outputs.cache-hit != 'true' && hashFiles('.alert-sent-marker') != ''
        uses: actions/cache/save@v4
        with:
          path: .alert-sent-marker
          key: intraday-paper-alert-${{ steps.fingerprint.outputs.hash }}
