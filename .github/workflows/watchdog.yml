name: Trading Bot Watchdog (Legacy Disabled)

# V4.3 watchdog retired. It previously self-healed by running run.py + diagnostics.py,
# which could send legacy V4.3 Telegram messages after V7.2 became the active engine.
# V7 health is now owned exclusively by v7-watchdog.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-disabled:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Legacy V4.3 watchdog is disabled."
          echo "Use V7 Adaptive Paper Engine + V7 Paper Watchdog."
