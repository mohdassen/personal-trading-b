name: Published Tactical ETF Round 6

on:
  push:
    branches:
      - research/edge-discovery-proof
    paths:
      - published_tactical_etf_round6.py
      - .github/workflows/published-tactical-etf-round6.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  round6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/edge-discovery-proof
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile published_tactical_etf_round6.py
      - name: Run locked tactical ETF round 6
        run: python published_tactical_etf_round6.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published_tactical_etf_round6.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist tactical ETF round 6 result"
          git push origin HEAD:research/edge-discovery-proof
      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('data/published_tactical_etf_round6.json'))
          print('## Published Tactical ETF Round 6')
          print(f"Overall: **{d['overall']}**")
          print(f"Candidates: **{', '.join(d['candidates']) if d['candidates'] else 'NONE'}**")
          for r in d['results']:
              print(f"- {r['strategy']}: {r['status']} | positive {r['positive_periods']}/3 | Sharpe wins {r['sharpe_wins']}/3 | DD wins {r['drawdown_wins']}/3 | stress positive {r['stress_positive_periods']}/3")
          PY
