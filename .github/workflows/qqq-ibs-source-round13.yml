name: QQQ IBS Source Validation Round 13

on:
  push:
    branches:
      - research/edge-discovery-proof
    paths:
      - qqq_ibs_source_validation_round13.py
      - .github/workflows/qqq-ibs-source-round13.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  round13:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/edge-discovery-proof
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile qqq_ibs_source_validation_round13.py
      - name: Run locked QQQ source validation
        run: python qqq_ibs_source_validation_round13.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/qqq_ibs_source_validation_round13.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist QQQ IBS source validation round 13"
          git push origin HEAD:research/edge-discovery-proof
      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('data/qqq_ibs_source_validation_round13.json'))
          print('## QQQ IBS Source Validation Round 13')
          print(f"Status: **{d['status']}**")
          print(f"Passing stress eras: **{d['passing_stress_eras']}/5**")
          print(f"Stress aggregate: {d['aggregate_stress']}")
          print(f"Bootstrap 95% avg return: {d['bootstrap95_avg_return']}")
          print(f"Delayed-entry stress: {d['one_extra_day_entry_delay_stress']}")
          print(f"Strip-best-5 stress: {d['strip_best_5_stress']}")
          print(f"Annualized compounded stress: {d['annualized_compounded_stress_since_2000']}")
          PY
