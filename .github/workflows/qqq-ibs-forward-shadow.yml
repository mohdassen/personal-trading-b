name: QQQ IBS Forward Shadow

on:
  workflow_dispatch:
  push:
    branches: [research/edge-discovery-proof]
    paths:
      - qqq_ibs_forward_shadow.py
      - .github/workflows/qqq-ibs-forward-shadow.yml
  schedule:
    - cron: '15 21 * * 1-5'

permissions:
  contents: write

jobs:
  shadow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/edge-discovery-proof
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile qqq_ibs_forward_shadow.py
      - name: Run frozen forward shadow
        run: python qqq_ibs_forward_shadow.py
      - name: Persist forward state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/qqq_ibs_forward_shadow.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "forward: update QQQ IBS shadow state"
          git push origin HEAD:research/edge-discovery-proof
