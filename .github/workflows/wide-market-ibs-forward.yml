name: Wide Market IBS Forward
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wide-market-ibs-forward.yml
  # Run after the US session has had ample time to settle in Yahoo daily data.
  # Tue-Sat 06:30 UTC processes the prior US trading session.
  schedule:
    - cron: '30 6 * * 2-6'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/edge-discovery-proof
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile wide_market_ibs_forward.py
      - name: Run wide-market frozen forward scanner
        run: python wide_market_ibs_forward.py
      - name: Validate frozen ledger before persistence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import date, timedelta
          p=Path('data/wide_market_ibs_forward.json')
          if not p.exists(): raise SystemExit('ledger missing')
          d=json.loads(p.read_text())
          assert d['rule_version']=='IBS-FROZEN-2026-09-18-r1'
          assert d['epoch']=='2026-09-28'
          assert d['cost_bps_roundtrip']==30.0
          assert d['live_execution']=='LOCKED'
          assert d['universe_size']>=200
          assert d['download_error_rate']<=0.20
          latest=date.fromisoformat(d['latest_downloaded_market_date'])
          today=date.today()
          expected=today-timedelta(days=1)
          while expected.weekday() >= 5:
              expected-=timedelta(days=1)
          if latest < expected:
              raise SystemExit(f'stale market data: latest={latest} expected_at_least={expected} today={today}')
          print('ledger validation PASS', {k:d[k] for k in ('universe_size','latest_downloaded_market_date','download_error_rate','stats')})
          PY
      - name: Telegram signal notification
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path
          d=json.loads(Path('data/wide_market_ibs_forward.json').read_text())
          buys=sorted({x if isinstance(x,str) else x['symbol'] for x in d.get('pending_entries',[])})
          exits=sorted({x if isinstance(x,str) else x['symbol'] for x in d.get('pending_exits',[])})
          date=d.get('latest_downloaded_market_date','غير معروف')
          parts=['📊 إشارات استراتيجية IBS — تداول تجريبي',f'📅 تاريخ جلسة الإشارة: {date}',
                 '⚠️ أسعار الإغلاق مرجعية وليست أسعار تنفيذ أو أوامر سوق.','']
          # Research-only priority: deepest close below the frozen lower band first.
          ranked=sorted(buys,key=lambda s:(
              -((d['states'][s]['pending_entry']['lower_band']-d['states'][s]['pending_entry']['close'])/
                d['states'][s]['pending_entry']['lower_band'])
              if d['states'][s].get('pending_entry') and d['states'][s]['pending_entry'].get('lower_band',0)>0 else 0,
              s))
          parts.append(f'🟢 أبرز 3 إشارات بحثية من {len(buys)} (ليست توصيات شراء):')
          for s in ranked[:3]:
              pe=d['states'][s].get('pending_entry') or {}
              price=float(pe.get('close') or 0)
              qty=int(min(750,1500,3000*0.25)//price) if price>0 else 0
              parts.append(f'• {s} | إغلاق مرجعي: ${price:.2f} | حد نظري: {qty} سهم | غير معتمد للتنفيذ: لا وقف خسارة مختبر')
          parts.append(f'باقي إشارات الشراء: {max(0,len(buys)-3)} | ترتيب بحثي لا يقيس احتمالات الربح')
          parts.append(f'🟠 إشارات خروج تجريبية: {len(exits)}')
          for s in exits:
              pos=d['states'].get(s,{}).get('position') or {}
              entry=pos.get('entry_price')
              parts.append(f'• {s} | دخول تجريبي: ${float(entry):.2f}' if entry is not None else f'• {s}')
          parts.append('⚠️ لا تبع قبل مطابقة الإشارة مع حيازاتك الفعلية.')
          parts.append('⚠️ الأعداد نظرية لكل سهم منفردًا؛ ليست محفظة مشتركة أو أوامر.')
          parts.append('')
          parts.extend(['📌 إشارات بحث تجريبية، وليست أوامر تداول.',
                        '⏳ إشارة يومية وليست سعر دخول لحظي؛ لا تتبع السعر دون تحقق.',
                        '🔒 لا أوامر حقيقية — PAPER ONLY.'])
          msg=chr(10).join(parts)
          token=os.environ.get('TELEGRAM_BOT_TOKEN',''); chat=os.environ.get('TELEGRAM_CHAT_ID','')
          if not token or not chat:
              print('Telegram secrets unavailable; notification skipped')
              raise SystemExit(0)
          data=urllib.parse.urlencode({'chat_id':chat,'text':msg}).encode()
          req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage',data=data)
          with urllib.request.urlopen(req,timeout=20) as r:
              if r.status != 200: raise SystemExit(f'Telegram HTTP {r.status}')
          print('Telegram signal sent')
          PY
      - name: Persist forward state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Maintain a canonical closed-trade ledger on the forward branch.
          # It is derived from the state snapshot but may only grow; any mutation/removal fails closed.
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('data/wide_market_ibs_forward.json').read_text())
          out=Path('data/wide_market_ibs_closed_trades.jsonl')
          current=[t for s in state['states'].values() for t in s['trades']]
          current.sort(key=lambda t:(t['exit_date'],t['symbol'],t['signal_date'],t['entry_date']))
          old=[]
          if out.exists():
              raw=out.read_text()
              raw=raw.replace(chr(92)+'n'+'{',chr(10)+'{').replace(chr(92)+'n',chr(10))
              old=[json.loads(x) for x in raw.splitlines() if x.strip()]
              if len(old)!=len({(x['symbol'],x['signal_date'],x['entry_date'],x['exit_date']) for x in old}):
                  raise SystemExit('duplicate legacy trades; refusing repair')
              canon=lambda x: json.dumps(x,sort_keys=True,separators=(',',':'))
              curset={canon(x) for x in current}
              missing=[x for x in old if canon(x) not in curset]
              if missing:
                  raise SystemExit(f'immutable trade ledger violation: {len(missing)} historical trades changed/disappeared')
              out.write_text(''.join(canon(x)+chr(10) for x in old),encoding='utf-8')
          oldkeys={(x['symbol'],x['signal_date'],x['entry_date'],x['exit_date']) for x in old}
          new=[x for x in current if (x['symbol'],x['signal_date'],x['entry_date'],x['exit_date']) not in oldkeys]
          with out.open('a',encoding='utf-8') as f:
              for x in new:
                  f.write(json.dumps(x,sort_keys=True,separators=(',',':'))+chr(10))
          print(f'immutable closed-trade ledger: old={len(old)} appended={len(new)} total={len(old)+len(new)}')
          PY
          python audit_ibs_robustness.py
          python audit_ibs_portfolio_proxy.py
          python audit_ibs_cash_portfolio.py
          python ibs_portfolio_daily_snapshot.py
          python ibs_daily_report.py
          python -m unittest -v test_manual_trade_risk_guard.py
          git add data/wide_market_ibs_forward.json data/wide_market_ibs_closed_trades.jsonl data/ibs_portfolio_daily_snapshot.json data/ibs_signal_review.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "forward: update wide-market IBS ledger"
          git pull --rebase origin research/edge-discovery-proof
          git push origin HEAD:research/edge-discovery-proof
