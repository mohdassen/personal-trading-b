name: Risk Managed Round 3

on:
  push:
    branches:
      - research/edge-discovery-proof
    paths:
      - risk_managed_round3.py
      - .github/workflows/risk-managed-round3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  round3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/edge-discovery-proof
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile risk_managed_round3.py
      - name: Run locked round 3
        run: python risk_managed_round3.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/risk_managed_round3.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist risk-managed round 3 result"
          git push origin HEAD:research/edge-discovery-proof
      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('data/risk_managed_round3.json'))
          print('## Risk Managed Round 3')
          print(f"Overall: **{d['overall']}**")
          print(f"Candidates: **{', '.join(d['candidates']) if d['candidates'] else 'NONE'}**")
          for r in d['results']:
              print(f"- {r['strategy']}: {r['status']} | Sharpe wins {r['sharpe_wins']}/15 | DD wins {r['drawdown_wins']}/15 | Relative wealth wins {r['relative_wealth_wins']}/15 | Recent Sharpe {r['recent_sharpe_wins']}/5 | Recent DD {r['recent_drawdown_wins']}/5")
          PY
