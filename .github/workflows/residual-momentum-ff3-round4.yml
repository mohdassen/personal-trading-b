name: Residual Momentum FF3 Round 4

on:
  push:
    branches:
      - research/edge-discovery-proof
    paths:
      - residual_momentum_ff3_round4.py
      - .github/workflows/residual-momentum-ff3-round4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  round4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/edge-discovery-proof
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile residual_momentum_ff3_round4.py
      - name: Run locked FF3 residual momentum
        run: python residual_momentum_ff3_round4.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/residual_momentum_ff3_round4.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist residual momentum FF3 round 4"
          git push origin HEAD:research/edge-discovery-proof
      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('data/residual_momentum_ff3_round4.json'))
          print('## Residual Momentum FF3 Round 4')
          print(f"Status: **{d['status']}**")
          print(f"Positive cells: **{d['positive_cells']}/15**")
          print(f"Positive 2024 folds: **{d['positive_2024_folds']}/5**")
          print(f"Positive stress folds: **{d['positive_stress_2024_folds']}/5**")
          print(f"Median excess Sharpe: {d['median_excess_sharpe_by_period']}")
          PY
