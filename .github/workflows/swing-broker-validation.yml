name: SWING Edge + Broker Validation

on:
  workflow_dispatch:
    inputs:
      run_full_research:
        description: 'Run the full SWING historical fidelity study (requires Alpaca API secrets)'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/swing-broker-validation.yml'

permissions:
  contents: write

concurrency:
  group: swing-edge-broker-validation
  cancel-in-progress: true

env:
  APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
  APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
  ALPACA_DATA_FEED: iex

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: execution/swing-edge-broker-path
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit test execution path
        run: python -m unittest tests.test_execution_path -v

      - name: Sync latest V7.2 paper state for forward evidence
        shell: bash
        run: |
          git fetch origin research/v7-catalyst-router-mtf
          git show origin/research/v7-catalyst-router-mtf:data/v7_paper_state.json > data/v7_paper_state.json

      - name: Extract clean SWING forward evidence
        run: python swing_forward_evidence.py

      - name: Detect Alpaca API credentials
        id: alpaca
        shell: bash
        run: |
          if [ -n "$APCA_API_KEY_ID" ] && [ -n "$APCA_API_SECRET_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Alpaca API credentials available. Running read-only connectivity checks."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Alpaca API credentials are not configured; API-key historical/broker steps will be skipped safely."
          fi

      - name: Read-only broker smoke
        if: steps.alpaca.outputs.ready == 'true'
        run: python broker_smoke.py --mode read_only

      - name: Small point-in-time research smoke
        if: steps.alpaca.outputs.ready == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.run_full_research == true)
        run: python swing_full_fidelity_research.py --start 2025-01-01 --feed iex --primary-limit 2 --independent-limit 1

      - name: Full SWING point-in-time research
        if: steps.alpaca.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.run_full_research == true
        run: python swing_full_fidelity_research.py --start 2019-01-01 --feed iex

      - name: Persist evidence to execution branch
        if: always()
        shell: bash
        run: |
          git restore data/v7_paper_state.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/swing_forward_evidence.json 2>/dev/null || true
          if [ -f data/swing_full_fidelity_research.json ]; then
            git add data/swing_full_fidelity_research.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research: update focused SWING evidence"
          for attempt in 1 2 3; do
            if git push origin HEAD:execution/swing-edge-broker-path; then exit 0; fi
            git fetch origin execution/swing-edge-broker-path
            git rebase -X theirs origin/execution/swing-edge-broker-path || { git rebase --abort || true; exit 1; }
          done
          exit 1

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### SWING Edge + Broker Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production V7.2 strategy rules changed: **NO**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live execution authorized: **NO**" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub Alpaca API credentials configured: **${{ steps.alpaca.outputs.ready || 'unknown' }}**" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/swing_forward_evidence.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('data/swing_forward_evidence.json'))
          print(f"- Clean SWING forward closed metrics: `{d.get('closed_metrics',{})}`")
          print(f"- Open SWING positions: **{d.get('open_count',0)}**")
          PY
          fi
          if [ -f data/swing_full_fidelity_research.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('data/swing_full_fidelity_research.json'))
          print(f"- Historical research verdict: **{d.get('verdict','UNKNOWN')}**")
          print(f"- Primary holdout: `{d.get('primary',{}).get('split',{}).get('holdout',{})}`")
          print(f"- Independent holdout: `{d.get('independent_holdout',{})}`")
          PY
          fi
