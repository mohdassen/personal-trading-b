# research-trigger: strategy-portfolio-followup-2026-09-17
name: V7 Edge Research Sprint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v7-edge-research.yml'

permissions:
  contents: write

concurrency:
  group: v7-edge-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v7-catalyst-router-mtf
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run historical edge research
        run: python v7_edge_research.py
      - name: Run strategy portfolio follow-up
        run: python v7_strategy_portfolio_followup.py
      - name: Persist research result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v7_edge_research.json
          git commit -m "research: update V7 historical edge evidence" || exit 0
          for attempt in 1 2 3; do
            if git push origin HEAD:research/v7-catalyst-router-mtf; then exit 0; fi
            git fetch origin research/v7-catalyst-router-mtf
            git rebase -X theirs origin/research/v7-catalyst-router-mtf || { git rebase --abort || true; exit 1; }
          done
          exit 1
