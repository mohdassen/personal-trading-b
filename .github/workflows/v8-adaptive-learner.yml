name: V8 Adaptive Shadow Learner

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-adaptive-shadow-learning
  cancel-in-progress: true

jobs:
  learn:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v7-catalyst-router-mtf
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync research branch
        run: |
          git fetch origin research/v7-catalyst-router-mtf
          git reset --hard origin/research/v7-catalyst-router-mtf

      - name: Test V8 learner guardrails
        run: python -m unittest tests.test_v8_adaptive_learner

      - name: Run controlled adaptive learner
        run: python v8_adaptive_learner.py

      - name: Verify learner cannot authorize live execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('data/v8_adaptive_learner.json').read_text())
          assert p['mode'] == 'SHADOW_LEARNING_ONLY'
          assert p['guardrails']['live_execution_authorized'] is False
          assert p['guardrails']['may_modify_v7'] is False
          assert p['guardrails']['may_modify_risk_limits'] is False
          assert p['guardrails']['may_override_sharia_screen'] is False
          assert p['promotion']['automatic_promotion'] is False
          assert p['promotion']['live_execution_authorized'] is False
          print('V8 safety gate: PASS')
          PY

      - name: Persist V8 shadow learning state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v8_adaptive_learner.json
          if git diff --cached --quiet; then
            echo "No new closed-trade evidence; learner state unchanged."
            exit 0
          fi
          git commit -m "chore: update V8 adaptive shadow learning state"
          for attempt in 1 2 3; do
            if git push origin HEAD:research/v7-catalyst-router-mtf; then exit 0; fi
            git fetch origin research/v7-catalyst-router-mtf
            git rebase -X theirs origin/research/v7-catalyst-router-mtf || { git rebase --abort || true; exit 1; }
          done
          exit 1
