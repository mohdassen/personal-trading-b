name: Trading Decision Engine
on:
  workflow_dispatch:
    inputs:
      force_run:
        description: Force scan outside regular US session
        required: false
        default: '1'
  schedule:
    - cron: '*/15 13-21 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: trading-engine
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_EQUITY_USD: ${{ vars.ACCOUNT_EQUITY_USD }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT }}
          MAX_POSITION_PCT: ${{ vars.MAX_POSITION_PCT }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run || '0' }}
        run: python run.py
      - name: Commit state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "chore: update trading engine state"
          git pull --rebase
          git push
      - uses: actions/configure-pages@v5
        if: success()
      - uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: docs
      - name: Deploy Pages
        id: deploy
        if: success()
        uses: actions/deploy-pages@v4
