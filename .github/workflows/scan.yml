name: Trading Decision Engine (Legacy Silent Rollback)

# V4.3 is retained only for explicit rollback/QA. Telegram credentials are
# intentionally NOT exposed here, so this workflow can never send user alerts.
on:
  workflow_dispatch:
    inputs:
      force_run:
        description: Force legacy QA scan outside regular US session
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: legacy-v43-qa
  cancel-in-progress: false

jobs:
  legacy-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run legacy V4.3 silently for QA only
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
          FORCE_RUN: ${{ inputs.force_run || '1' }}
          DIAGNOSTICS_NOTIFY_ON_PUSH: 'false'
        run: |
          python run.py
          python diagnostics.py
      - name: Confirm no Telegram path
        run: echo "Legacy V4.3 QA completed with Telegram credentials intentionally unavailable."
