name: Trading Decision Engine
on:
  workflow_dispatch:
    inputs:
      force_run:
        description: Force scan outside regular US session
        required: false
        default: '1'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'run.py'
      - 'diagnostics.py'
      - 'requirements.txt'
      - '.github/workflows/scan.yml'
  schedule:
    # Two independent, staggered heartbeats reduce the chance that a delayed/dropped
    # GitHub cron leaves the market session unscanned. The watchdog runs separately
    # a few minutes later and verifies confirmed Telegram delivery.
    - cron: '6,21,36,51 * * * 1-5'
    - cron: '9,24,39,54 * * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: trading-engine
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync latest state before engine
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Run engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_EQUITY_USD: ${{ vars.ACCOUNT_EQUITY_USD }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT }}
          MAX_POSITION_PCT: ${{ vars.MAX_POSITION_PCT }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_run) || (github.event_name == 'push' && '1') || '0' }}
        run: python run.py
      - name: Market Discovery Diagnostics
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DIAGNOSTICS_NOTIFY_ON_PUSH: ${{ github.event_name == 'push' }}
        run: python diagnostics.py
      - name: Commit state safely
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "chore: update trading engine state"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict on attempt $attempt; rebasing state commit on latest main"
            git fetch origin main
            git rebase -X theirs origin/main || {
              git rebase --abort || true
              exit 1
            }
          done
          echo "Unable to persist state after 3 attempts"
          exit 1
      - uses: actions/configure-pages@v5
        if: success()
      - uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: docs
      - name: Deploy Pages
        id: deploy
        if: success()
        uses: actions/deploy-pages@v4
