name: ETF Published Round 5

on:
  push:
    branches:
      - research/edge-discovery-proof
    paths:
      - etf_published_round5.py
      - .github/workflows/etf-published-round5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  round5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/edge-discovery-proof
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile etf_published_round5.py
      - name: Run locked ETF round 5
        run: python etf_published_round5.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf_published_round5.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist ETF published round 5 result"
          git push origin HEAD:research/edge-discovery-proof
      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('data/etf_published_round5.json'))
          print('## ETF Published Round 5')
          print(f"Overall: **{d['overall']}**")
          print(f"Candidates: **{', '.join(d['candidates']) if d['candidates'] else 'NONE'}**")
          for r in d['results']:
              print(f"- {r['strategy']}: {r['status']}")
          PY
