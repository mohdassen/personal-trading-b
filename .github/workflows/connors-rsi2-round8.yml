name: Connors RSI2 Round 8

on:
  push:
    branches:
      - research/edge-discovery-proof
    paths:
      - connors_rsi2_round8.py
      - .github/workflows/connors-rsi2-round8.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  round8:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/edge-discovery-proof
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile connors_rsi2_round8.py
      - name: Run locked Connors RSI2 round 8
        run: python connors_rsi2_round8.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/connors_rsi2_round8.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist Connors RSI2 round 8 result"
          git push origin HEAD:research/edge-discovery-proof
      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('data/connors_rsi2_round8.json'))
          print('## Connors RSI2 Round 8')
          print(f"Status: **{d['status']}**")
          for p,g in d['period_gates'].items():
              print(f"- {p}: baseline {g['baseline']['passing_symbols']}/{g['baseline']['eligible_symbols']} | stress {g['stress']['passing_symbols']}/{g['stress']['eligible_symbols']}")
          PY
