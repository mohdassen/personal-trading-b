name: IBS Lower Band Round 10

on:
  push:
    branches:
      - research/edge-discovery-proof
    paths:
      - ibs_lower_band_round10.py
      - .github/workflows/ibs-lower-band-round10.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  round10:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/edge-discovery-proof
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile ibs_lower_band_round10.py
      - name: Run locked IBS lower-band round 10
        run: python ibs_lower_band_round10.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ibs_lower_band_round10.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist IBS lower-band round 10"
          git push origin HEAD:research/edge-discovery-proof
      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('data/ibs_lower_band_round10.json'))
          print('## IBS Lower Band Round 10')
          print(f"Status: **{d['status']}**")
          for p,g in d['period_gates'].items():
              print(f"- {p}: baseline {g['baseline']['passing_symbols']}/{g['baseline']['eligible_symbols']} | stress {g['stress']['passing_symbols']}/{g['stress']['eligible_symbols']}")
          PY
