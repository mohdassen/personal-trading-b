name: QQQ IBS Portfolio Round 14
on:
  push:
    branches: [research/edge-discovery-proof]
    paths: [qqq_ibs_portfolio_round14.py, .github/workflows/qqq-ibs-portfolio-round14.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  round14:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/edge-discovery-proof, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m py_compile qqq_ibs_portfolio_round14.py
      - run: python qqq_ibs_portfolio_round14.py
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/qqq_ibs_portfolio_round14.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: persist QQQ IBS portfolio round 14"
          git push origin HEAD:research/edge-discovery-proof
