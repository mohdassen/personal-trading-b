name: Weekly Backtest
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/trading_bot/backtester.py'
      - 'src/trading_bot/strategies.py'
      - 'backtest_retest.py'
      - 'backtest_pullback.py'
      - 'backtest_evidence_momentum.py'
      - 'backtest_adaptive_momentum.py'
      - 'backtest_portfolio_momentum.py'
      - 'tests/test_portfolio_momentum.py'
      - 'config/settings.yml'
      - 'config/universe.yml'
      - 'config/groups.yml'
      - '.github/workflows/backtest.yml'
  schedule:
    - cron: '15 2 * * 0'
permissions:
  contents: write
concurrency:
  group: trading-backtest
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate V4.9 portfolio controls
        run: python tests/test_portfolio_momentum.py
      - name: Run V4.9 portfolio-aware momentum validation
        run: |
          python backtest_portfolio_momentum.py
          cp data/backtest.json /tmp/backtest.json
      - name: Publish backtest result safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/backtest.json data/backtest.json
            git add data/backtest.json
            if git diff --cached --quiet; then
              echo "Backtest result already current"
              exit 0
            fi
            git commit -m "chore: V4.9 portfolio-aware momentum validation results"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update; retrying..."
          done
          echo "Unable to publish backtest result after retries"
          exit 1
